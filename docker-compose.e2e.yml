# Disposable test stack only. No application volumes, .env, or development fixtures.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bitemap_e2e
      POSTGRES_USER: bitemap_e2e
      POSTGRES_PASSWORD: disposable_e2e_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitemap_e2e -d bitemap_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    build: ./Backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bitemap_e2e
      DB_USERNAME: bitemap_e2e
      DB_PASSWORD: disposable_e2e_only
      AUTH_RATE_LIMIT_SECRET: disposable-e2e-auth-limit-secret-32-characters
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 5s
      retries: 60
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:15173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
