server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  application:
    name: Backend

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bitemap}
    username: ${DB_USERNAME:bitemap}
    password: ${DB_PASSWORD}

  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-migration-naming: true

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
