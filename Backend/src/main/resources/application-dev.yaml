spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: false
    operations-sorter: alpha
    tags-sorter: alpha
  paths-to-match: /api/**

# Local development only. Non-dev startup requires AUTH_RATE_LIMIT_SECRET.
bitemap:
  auth-limit:
    secret: ${AUTH_RATE_LIMIT_SECRET:development-only-auth-limiter-key-not-for-production}
