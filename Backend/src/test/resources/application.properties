# Disposable test configuration; production policy is tested with explicit overrides.
bitemap.auth-limit.secret=isolated-test-secret-at-least-32-characters
bitemap.auth-limit.login-account-capacity=100000
bitemap.auth-limit.login-ip-capacity=100000
bitemap.auth-limit.registration-ip-capacity=100000
bitemap.recovery.worker-enabled=false
# Cached Spring test contexts must not each reserve ten PostgreSQL connections.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
